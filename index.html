<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>calculadora</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="fundo">
            <h1>Criado por Kauã</h1>
            <div class="calculadora">
                <h1>calculadora</h1>
                <p id="resultado" class="table"></p>
                  <input type="text" id="table" class="table" readonly>
                <table>
                    <div class="display" id="resultado"></div>
                    <tr>
                        <td><button class="botao" onclick="clean('C')"> C </button></td>
                        <td><button class="botao" onclick="backspace('&#9003')"> &#9003 </button></td>
                        <td><button class="botao" onclick="insert('/')"> / </button></td>
                        <td><button class="botao" onclick="insert('*')"> * </button></td>
                    </tr>
                     <tr>
                        <td><button class="botao" onclick="insert('7')"> 7 </button></td>
                        <td><button class="botao" onclick="insert('8')"> 8 </button></td>
                        <td><button class="botao" onclick="insert('9')"> 9 </button></td>
                        <td><button class="botao" onclick="insert('-')"> - </button></td>
                    </tr>
                     <tr>
                        <td><button class="botao" onclick="insert('4')"> 4 </button></td>
                        <td><button class="botao" onclick="insert('5')"> 5 </button></td>
                        <td><button class="botao" onclick="insert('6')"> 6 </button></td>
                        <td><button class="botao" onclick="insert('+')"> + </button></td>
                    </tr>
                    <tr>
                        <td><button class="botao" onclick="insert('1')"> 1 </button></td>
                        <td><button class="botao" onclick="insert('2')"> 2 </button></td>
                        <td><button class="botao" onclick="insert('3')"> 3 </button></td>
                        <td rowspan="2"><button class="botao" style="height: 132px;" onclick="calcular()">=</button></td>
                    </tr>
                    <tr>
                        <td colspan="2"><button class="botao" style="width: 132px; height: 60px;" onclick="insert('0')">0</button></td>
                        <td><button class="botao" onclick="insert('.')"> , </button></td>
                    </tr>
                    </tr>
                    

                </table>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
